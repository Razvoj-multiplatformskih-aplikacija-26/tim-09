name: backoffice
description: CarWash & Go backoffice for dispatchers on a large screen.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  blocs:
    path: ../../packages/blocs
  domain:
    path: ../../packages/domain
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  ui:
    path: ../../packages/ui
  use_cases:
    path: ../../packages/use_cases

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true