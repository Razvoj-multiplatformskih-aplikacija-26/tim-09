name: carwash-kt2

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carwash}
      POSTGRES_USER: ${POSTGRES_USER:-carwash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carwash_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carwash} -d ${POSTGRES_DB:-carwash}"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-carwash}
      POSTGRES_USER: ${POSTGRES_USER:-carwash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carwash_dev}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}
      MIGRATIONS_PATH: database/migrations
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/bin/server", "--health"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: carwash_test
      POSTGRES_USER: carwash
      POSTGRES_PASSWORD: carwash_dev
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwash -d carwash_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
