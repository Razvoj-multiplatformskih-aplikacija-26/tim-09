name: carwash_go_workspace
description: CarWash & Go, one system in one language. The workspace resolves every app and package together.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/mobile
  - apps/backoffice
  - apps/server
  - packages/api_client
  - packages/contracts
  - packages/api_mapping
  - packages/domain
  - packages/platform_adapters
  - packages/use_cases
  - packages/blocs
  - packages/ui

dev_dependencies:
  flutter_lints: 6.0.0
